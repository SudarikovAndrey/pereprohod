:root{--disp:'Druk Cyr',Impact,'Arial Black',sans-serif;--bg:#0d2417;--panel:#123020;--cream:#efe4cc;--cream2:#e3d6b8;--ink:#2a221c;--mut:#5f7a68;--red:#c9432f;--red2:#a83422;--green:#3f8f4c;--gold:#e0a52a;--line:#d6c8a8;--txt:#efe4cc}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.35 'Suisse Intl',-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;margin:0 auto;position:relative}
#top>*{width:100%;max-width:520px;pointer-events:auto}
#top,#panel,#tip,#toast{zoom:var(--ui,1)}.nozoom #top,.nozoom #panel,.nozoom #tip,.nozoom #toast{zoom:1}
.card{zoom:1}
#top{position:absolute;left:0;right:0;top:0;z-index:35;padding:4px 8px 0;display:flex;flex-direction:column;gap:3px;pointer-events:none;align-items:center}
.bar0{display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
.ava{display:flex;flex-direction:column;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--cream);color:var(--ink);border:3px solid #8a7e6e;padding:0;line-height:1;box-shadow:0 2px 0 #0004}
.ava span{font-size:18px}.ava small{font-size:8px;font-weight:800;white-space:nowrap}
.round{width:32px;height:32px;border-radius:50%;background:var(--cream);color:var(--ink);padding:0;font-size:20px;font-weight:800;box-shadow:0 2px 0 #0004;margin-left:auto}
.bar1{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1.1fr);gap:4px;align-items:stretch}
.cur{display:flex;align-items:center;gap:0;background:var(--cream);color:var(--ink);border-radius:8px;padding:0;height:26px;overflow:hidden;font-weight:800;font-size:13px;box-shadow:0 2px 0 #0004}.cur b{flex:1;text-align:right;padding:0 6px}
.cur .ic{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:900;padding:0;background:#555;flex:0 0 auto}
.cur .ic.g{background:#3f8f4c}.cur .ic.b{background:#3e5a8a}.cur .ic.o{background:#e0902a}.cur .ic.y{background:#8a6a1f}
.cur.hard{background:#3e5a8a;color:#fff}.cur.hard .ic{background:#2c4470}
button.hard{background:#3e5a8a;box-shadow:0 3px 0 #2c4470}
.orderbar{position:relative;width:100%;max-width:520px;height:18px;border-radius:11px;overflow:hidden;background:#2b2723e6;box-shadow:0 2px 0 #0004;cursor:pointer}
.orderbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3f8f4c,#2a6135);transition:width .4s ease}
.orderbar em{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-style:normal;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #0008;padding:0 8px}
.orderbar em.me{left:0}.orderbar em.them{right:0}
.chip{background:var(--cream);color:var(--ink);border:0;border-radius:9px;padding:5px 9px;font-size:13px;font-weight:700;box-shadow:0 2px 0 #0004;white-space:nowrap}
#stage{flex:1;min-height:0;position:relative}
#board{width:100%;height:100%;display:block;touch-action:none}
#panel{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(20,17,14,0) 0,rgba(20,17,14,.6) 45%,rgba(20,17,14,.92) 100%);padding:70px 10px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;z-index:5;pointer-events:none}
#panel>*{pointer-events:auto;width:100%;max-width:520px}
#dock{display:flex;gap:8px;align-items:flex-end;justify-content:center}
.diebox{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-14px}
.pill{background:var(--cream);color:var(--ink);border-radius:12px;padding:3px 12px;font-weight:800;font-size:15px;box-shadow:0 2px 0 #0004}
.pill.dark{background:#2a2521;color:#fff;font-size:12px;font-weight:700;padding:2px 10px}
#tilebar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--cream);color:var(--ink);box-shadow:0 3px 0 #0005;padding:9px 12px;font-size:14px;font-weight:700;text-align:left;margin-bottom:6px}
#tilebar b{padding:5px 12px;border-radius:8px;font-size:13px;white-space:nowrap}
#tilebar.can b{background:var(--green);color:#f2fbf3;box-shadow:0 2px 0 #00000030}#tilebar.cant b{background:#c9c2b0;color:#6b5f52}
#tilebar[hidden]{display:none}
#tilebar.pulse{animation:tbPulse .6s ease-in-out 4}@keyframes tbPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px);box-shadow:0 7px 0 #0005}}
button{border:0;border-radius:12px;cursor:pointer;font-weight:700;touch-action:manipulation;font-size:15px;padding:10px 14px;background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red2)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red2)}button:disabled{opacity:.45;cursor:default}
button.sec{background:#8a7e6e;box-shadow:0 3px 0 #5f554a}button.ok{background:var(--green);box-shadow:0 3px 0 #2d6b38}button.bad{background:var(--red)}

function buildTiles(){
  const ids=CORE10.map.split(','), t=[]; let pi=0,bi=0,si=0,pr=0;
  // ранг точки по цене — от него градация охраны
  const byCost=CORE10.points.slice().sort((a,b)=>a.cost-b.cost).map(p=>p.id);
  for(let i=0;i<40;i++){
    const code=ids[i].split('_')[0];
    const o={i,code,cid:ids[i],type:CODE2TYPE[code],owner:null,tier:1,capLvl:1,salesLvl:1,goods:0,level:0,captured:null};
    if(o.type==='kiosk'){o.cfg=CORE10.points[pi++%CORE10.points.length];o.cat=o.cfg.good;o.grade=CFG.POINT_GRADES[byCost.indexOf(o.cfg.id)]||'mid';o.rank=byCost.indexOf(o.cfg.id);}
    else if(o.type==='biz'){o.cfg=CORE10.biz[bi++%CORE10.biz.length];o.price=Math.round(o.cfg.cost*CFG.BIZ_PRICE_K/10)*10;o.level=1;}
    else if(o.type==='wh'){const role=S_ROLE[si++%S_ROLE.length];o.type=role;if(role==='prod'){o.cat=CATS[pr++%CATS.length];o.level=0;}}
    t.push(o);
  }
  return t;
}

// Кривая статов в дампе — до уровня 100: выше клампим (в Переделе клампили до 160 и получали пустую строку)
const CF={dmg:0,hp:1,armor:2,cd:3,crit:4,critF:5,miss:6,evade:7,speed:8,power:9,edps:10,ehp:11};
const CF_MAX=100;
const cfCard=id=>CORE_FIGHT.cards[id]||CORE_FIGHT.cards['0'];
function cfRow(cls,rar,lvl){const t=CORE_FIGHT.curve[cls+'|'+rar];if(!t)return null;const L=Math.max(1,Math.min(CF_MAX,Math.round(lvl)));return t[L]||t[CF_MAX];}
function cfStats(p){const c=cfCard(p.card),r=cfRow(c.cls,c.rarity,p.lvl);return r?{cls:c.cls,rarity:c.rarity,row:r,ab:c.abilities||{}}:null;}
// powerCalculated из PatsanCard.cs: (EHP + 4×EDPS)/10 — боевая сила, не StatPower
const coreCombatPower=p=>{const s=cfStats(p);return s?Math.round((s.row[CF.ehp]+4*s.row[CF.edps])/10):0;};
const powerOf=list=>list.reduce((a,p)=>a+p.power,0);
let _cardIds=null; const cardIds=()=>_cardIds||(_cardIds=Object.keys(CORE_FIGHT.cards).filter(id=>+id>=0));

// «форма дня»: логнормальный множитель силы стороны за бой, обрезан ±2,5σ
function formNoise(){const s=CFG.FIGHT_NOISE||0;if(!s)return 1;let u=0,v=0;while(!u)u=Math.random();v=Math.random();const z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);return Math.exp(Math.max(-2.5,Math.min(2.5,z))*s);}
function cfMake(p,hpMul,dmgMul){
  const s=cfStats(p);
  if(!s)return{name:p.name||'?',hp:1,maxHp:1,dmg:1,armor:0,cd:1,crit:0,critF:1,miss:0,evade:0,ab:{},K:CORE_FIGHT.skills,src:p,t:0,alive:true,cdMul:1,paraLeft:0,paraT:0,healT:0,berserk:false,retarget:0,target:null};
  const r=s.row,K=CORE_FIGHT.skills, has=n=>s.ab[n]!==undefined&&p.lvl>=s.ab[n];
  return{name:p.name||'?',src:p,maxHp:Math.round(r[CF.hp]*(hpMul||1)),hp:Math.round(r[CF.hp]*(hpMul||1)),dmg:r[CF.dmg]*(dmgMul||1),armor:r[CF.armor],cd:r[CF.cd]/1000,
    crit:r[CF.crit],critF:r[CF.critF],miss:r[CF.miss],evade:r[CF.evade],
    ab:{berserk:has('Berserk'),heal:has('HealTarget'),para:has('ParaliseTarget'),armorBuff:has('BuffArmor')},
    K,t:0,alive:true,cdMul:1,paraLeft:0,healT:0,paraT:0,berserk:false,retarget:0,target:null};
}
function cfPick(f,foes){let best=null,bn=1e9;for(const x of foes){if(!x.alive)continue;let n=0;for(const y of f.team)if(y.alive&&y.target===x)n++;if(n<bn){bn=n;best=x;}}return best;}
// один бой; возвращает победившую сторону и выживших
function coreFight(A,B,o){
  o=o||{}; const dt=o.dt||0.05, maxT=o.maxSeconds||120;
  const kA=formNoise(), kB=formNoise();                       // форма дня каждой стороны: и урон, и живучесть
  const a=A.map(p=>cfMake(p,kA,kA)), b=B.map(p=>cfMake(p,kB,kB));
  a.forEach(f=>f.team=a); b.forEach(f=>f.team=b);
  const n=Math.min(a.length,b.length); for(let i=0;i<n;i++){a[i].target=b[i];b[i].target=a[i];}
  let t=0;
  const step=(team,foes)=>{for(const f of team){if(!f.alive)continue;
    if(f.paraLeft>0){f.paraLeft-=dt;if(f.paraLeft<=0)f.cdMul=1;}
    if(f.ab.berserk&&!f.berserk&&f.hp/f.maxHp<=f.K.Berserk[0]/100){f.dmg*=f.K.Berserk[1];f.berserk=true;}
    if(f.ab.heal){f.healT+=dt;if(f.healT>=f.K.HealTarget[0]){f.healT=0;const m=f.team.filter(x=>x.alive&&x!==f).sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp);if(m.length)m[0].hp=Math.min(m[0].maxHp,m[0].hp+m[0].maxHp*f.K.HealTarget[1]/100);}}
    if(!f.target||!f.target.alive){f.retarget+=dt;if(f.retarget>=0.4){f.target=cfPick(f,foes);f.retarget=0;}continue;}
    if(f.ab.para){f.paraT+=dt;if(f.paraT>=f.K.ParalyzeTarget[0]){f.paraT=0;f.target.cdMul=1+f.K.ParalyzeTarget[1]/100;f.target.paraLeft=f.K.ParalyzeTarget[2];}}
    f.t+=dt; if(f.t<f.cd*f.cdMul)continue; f.t=0;
    if(Math.random()<=f.miss)continue;
    const crit=Math.random()<=f.crit, dmg=Math.floor(f.dmg*(crit?f.critF:1)), g=f.target;
    if(Math.random()<=g.evade)continue;
    g.hp-=Math.max(0,Math.min(dmg,dmg-g.armor)); if(g.hp<=0){g.hp=0;g.alive=false;}}};
  while(t<maxT){const la=a.filter(f=>f.alive),lb=b.filter(f=>f.alive);if(!la.length||!lb.length)break;
    if(Math.random()<0.5){step(a,b);step(b,a);}else{step(b,a);step(a,b);} t+=dt;}
  const la=a.filter(f=>f.alive),lb=b.filter(f=>f.alive);
  return{win:la.length&&!lb.length?'a':lb.length&&!la.length?'b':(la.length>=lb.length?'a':'b'),aliveA:la,aliveB:lb,seconds:Math.round(t*10)/10};
}

// детерминированный набор карточек по ключу — охрана точки не меняется от захода к заходу
function makeGang(power,seed,n){
  n=n||5; const ids=cardIds(), ns=NAMES; let x=(seed*2654435761)>>>0; const rnd=()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296;};
  const cards=Array.from({length:n},()=>ids[Math.floor(rnd()*ids.length)]);
  const names=Array.from({length:n},()=>ns[Math.floor(rnd()*ns.length)]);
  const build=L=>cards.map((c,i)=>makePatsan(names[i],L,c));
  // пять бойцов первого уровня — это уже 225–300 силы: слабую банду делаем меньше, а не слабее
  if(n>1&&powerOf(build(1))>power*1.08)return makeGang(power,seed+1,n-1);
  let lo=1,hi=CF_MAX,best=build(1);
  for(let it=0;it<10;it++){const L=Math.round((lo+hi)/2),b=build(L),s=powerOf(b);best=b;if(s<power)lo=L+1;else hi=L-1;if(lo>hi)break;}
  // подбираем ближайший из соседей
  const cands=[Math.max(1,lo-1),lo,Math.min(CF_MAX,lo+1)].map(L=>build(L));
  best=cands.reduce((a,b)=>Math.abs(powerOf(b)-power)<Math.abs(powerOf(a)-power)?b:a);
  return best;
}

async function resolveFight(o,squad,k,prog){
  const gang=o.gang, r=coreFight(squad,gang.list), win=r.win==='a';
  tire(squad); S.lapFights++; S.diag.picks[k]++;
  const f=S.diag.fights[o.kind]||(S.diag.fights[o.kind]=[0,0]); f[0]++; if(win)f[1]++;
  track('fight',{kind:o.kind,pick:k,mine:powerOf(squad),theirs:gang.power,grade:gang.grade,win,prog:Math.round((prog||0)*100),secs:r.seconds});
  if(!S.fast){
    await modal(`<h2>${win?'🏆 Победа':'💥 Отхватили'}</h2>
      <div class="vs"><div class="vsc me"><b>${powerOf(squad)}</b><span>${SQ_NAMES[k].toLowerCase()} · выжило ${r.aliveA.length} из ${squad.length}</span></div><div class="vsx">${r.seconds}с</div><div class="vsc them"><b>${gang.power}</b><span>${gang.name} · осталось ${r.aliveB.length}</span></div></div>
      <p class="t">${win?(o.winText||'Разогнали.'):(o.loseText||`Не вышло. Отряд отдыхает ${restTxt()}.`)}</p>`,[{t:win?'Красава':'Понял',v:1,cls:win?'ok':'sec'}]);
  }
  return{win,squad,pick:k};
}
// бот: самый слабый набор, который побеждает с запасом; без тел — энергетик, иначе пропуск
function botChoose(o){
  const gang=o.gang;
  const tryPick=()=>{const sq=squads();if(!freeBodies().length)return null;for(const k of ['weak','mid','strong']){const p=odds(sq[k],gang.list,CFG.SIMS.bot);if(p>=BOT.minOdds)return{k,p,set:sq[k]};}return null;};
  let c=tryPick();
  if(!c&&!freeBodies().length&&BOT.useEnergetic&&(S.energetics>0||canAd())){useEnergetic();c=tryPick();}
  if(!c){S.diag.skipped++;S.diag.skips[o.kind]=(S.diag.skips[o.kind]||0)+1;if(!freeBodies().length)S.diag.noBodies++;return null;}
  return resolveFight(o,c.set,c.k,c.p);
}

function buyPlan(budget){const lots=[];
  for(const t of myKiosks()){if(t.captured)continue;const room=cap(t)-t.goods;if(room<=0)continue;const buy=buyPrice(t),m=margin(t);const forNext=Math.max(0,Math.min(room,sales(t)-t.goods));
    if(forNext>0)lots.push({t,n:forNext,buy,m,roi:m/buy,pri:0});const rest=room-forNext;if(rest>0)lots.push({t,n:rest,buy,m,roi:m/buy,pri:1});}
  lots.sort((a,b)=>a.pri-b.pri||b.roi-a.roi);let left=budget,spent=0,gain=0,units=0;const plan=[];
  for(const l of lots){const n=Math.min(l.n,Math.floor(left/l.buy));if(n<=0)continue;plan.push({t:l.t,n});left-=n*l.buy;spent+=n*l.buy;units+=n;if(l.pri===0)gain+=n*l.m;}
  return{plan,spent,gain,units};}
function applyPlan(bp){bp.plan.forEach(x=>{x.t.goods+=x.n;});S.cash-=bp.spent;S.diag.spent.goods+=bp.spent;}

// ================= ХОД: кубик, движение, круг, клетки =================
async function roll(){
  if(moving||S.finished)return;
  if(S.rolls<=0)return rollsOut();
  try{return await turn();}
  catch(e){console.error('turn failed',e);track('turn_error',{msg:String(e&&e.message||e),stack:String(e&&e.stack||'').slice(0,400),pos:S.pos,lap:S.laps});anim=null;moving=false;save();render();draw();log('⚠️ Сбой на ходу — управление отпущено.');}
}
async function turn(){
  S.rolls--; moving=true; pan={x:0,y:0}; if(!S.fast){hideTip();render();}
  const a=rndi(1,6),b=rndi(1,6),dbl=a===b,total=a+b; S.lastDice=[a,b];
  if(S.jail>0){
    if(dbl){S.jail=0;if(!S.fast)toast(`🎲 ${a} + ${b} — дубль! Выпустили.`);}
    else{S.jail--;if(S.jail>0){if(!S.fast)toast(`🎲 ${a} + ${b} — сидишь. Попыток: ${S.jail}`);}else{const m=Math.min(S.cash,S.jailFine);S.cash-=m;if(!S.fast)toast(`🎲 ${a} + ${b} — отпустили, списали ${fmtR(m)}`);}
      await wait(300);moving=false;save();render();return;}
  } else {track('roll',{a,b,dbl,from:S.pos});if(!S.fast)toast(`🎲 ${a} + ${b}${dbl?' — дубль!':''}`);}
  await wait(250);
  const durs=cellDurations(total,CFG.MOVE_MS*total*1.25);
  for(let k=0;k<total;k++){
    const from=S.pos,to=(S.pos+1)%40;
    await step(from,to,durs[k],'lin'); S.pos=to;
    const t=S.tiles[S.pos];
    if(S.pos===0)await lapDone();
    if((t.type==='kiosk'||t.type==='biz')&&isMine(t)&&!t.captured){const last=k===total-1,biz=t.type==='biz',f=biz?(last?bizLand(t):bizPass(t)):fee(t);S.cash+=f;S.lapFees+=f;
      if(!S.fast){fly('💵',AT.tile(t.i),AT.cash(),biz?flyN(f):1,{pulse:'sCash'});float(t.i,(biz&&last?'💰 касса +':'+')+shortN(f),biz?'#ffd54f':'#b7ad98',biz&&last?1.6:biz?1.1:0.8);render();}}
  }
  await land(S.tiles[S.pos]);
  moving=false; save(); render();
  if(!S.fast&&((S.landN||0)%3===0))flush();
  if(S.rolls<=0&&!S.finished&&!S.fast)setTimeout(()=>{if(!moving)rollsOut();},400);
}
const ease={lin:p=>p,one:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2};
const easeInOut=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function cellDurations(n,totalMs){const t=[];for(let k=0;k<=n;k++){const target=k/n;let lo=0,hi=1;for(let it=0;it<26;it++){const mid=(lo+hi)/2;if(easeInOut(mid)<target)lo=mid;else hi=mid;}t.push((lo+hi)/2*totalMs);}return Array.from({length:n},(_,k)=>Math.max(40,t[k+1]-t[k]));}
function step(from,to,ms,kind){if(CFG.SPEED>=100||(S&&S.fast))return Promise.resolve();return new Promise(res=>{const a={from,to,t0:performance.now(),ms:ms/CFG.SPEED,kind,res,done:false};anim=a;kick();setTimeout(()=>{if(anim===a&&!a.done){a.done=true;a.p=1;res();}},a.ms+60);});}
function kick(){if(!looping){looping=true;requestAnimationFrame(loop);}}
function loop(now){if(anim&&!anim.done){let p=Math.min(1,(now-anim.t0)/anim.ms);anim.p=ease[anim.kind](p);if(p>=1){anim.done=true;anim.p=1;anim.res();}}
  draw(); if((anim&&!anim.done)||floats.length||camMoving)requestAnimationFrame(loop);else looping=false;}

function cfgHash(){try{const o=Object.assign({},CFG);['SPEED','TIME_SCALE','ZOOM','ZOOM_MIN','ZOOM_MAX','MOVE_MS','CAM_SMOOTH'].forEach(k=>delete o[k]);const str=JSON.stringify(o);let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return(h>>>0).toString(36);}catch(e){return'?';}}
const TELEMETRY_URL='';
let dbP=null,lastAct=0,pending=[];

function getDb(){if(!dbP){dbP=(window.claude&&claude.use)?claude.use('db').catch(()=>null):Promise.resolve(null);}return dbP;}
function track(type,data){if(!S||S.fast)return;pending.push(Object.assign({t:Date.now(),type,lap:S.laps,pos:S.pos,cash:S.cash,rolls:S.rolls,playMs:Math.round(S.playMs||0)},data||{}));
  try{localStorage.setItem(LOGK,JSON.stringify(pending.slice(-400)));}catch(e){} if(pending.length>=6)flush();}
function summaryDoc(){const r=runResult();return Object.assign({runId:S.runId,player:S.player||null,version:VERSION,cfg:cfgHash(),startVersion:S.startVersion||null,startCfg:S.startCfg||null,
  startedAt:S.startedAt,updatedAt:Date.now(),kind:'live',map:S.preset,shards:S.shards,playMin:Math.round((S.playMs||0)/60000*10)/10,sessions:S.sessions||1,chunks:S.chunkN||0,ua:navigator.userAgent.slice(0,80)},r);}
function histPush(row){try{const all=JSON.parse(localStorage.getItem(HISTK)||'[]');const i=all.findIndex(x=>x.runId===row.runId&&x.kind===row.kind);if(i>=0)all[i]=row;else all.push(row);while(all.length>500)all.shift();localStorage.setItem(HISTK,JSON.stringify(all));}catch(e){}}
const histAll=()=>{try{return JSON.parse(localStorage.getItem(HISTK)||'[]');}catch(e){return[];}};
function localFlush(){if(!S||!pending.length)return;const chunk=pending.splice(0,pending.length);
  try{const all=JSON.parse(localStorage.getItem(FULLK)||'{}');if(all.runId!==S.runId){all.runId=S.runId;all.events=[];}all.events=(all.events||[]).concat(chunk);all.summary=summaryDoc();localStorage.setItem(FULLK,JSON.stringify(all));localStorage.setItem(LOGK,'[]');}catch(e){}
  if(TELEMETRY_URL){try{fetch(TELEMETRY_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({summary:summaryDoc(),events:chunk})});}catch(e){}}}

async function flush(final){const db=await getDb();if(!S)return;if(!db){localFlush(final);return;}if(!pending.length&&!final)return;
  try{if(pending.length){const chunk=pending.splice(0,pending.length);S.chunkN=(S.chunkN||0)+1;await db.doc(`runs/${S.runId}/chunks/c${String(S.chunkN).padStart(4,'0')}`).set({events:chunk,n:chunk.length,lap:S.laps,at:Date.now()});try{localStorage.setItem(LOGK,'[]');}catch(e){}}

// ---------- бот: играет как разумный игрок, без анимации ----------
const BOT={minOdds:0.7, useEnergetic:true, seedPolicy:'smart',   // tail — хвост (дешёвые уровни), top — сильных, smart — хвост, пока перестройка не упёрлась в крышу
  get reserve(){return Math.round(avgPrice()*0.3);}};
function botStock(){const bp=buyPlan(Math.max(0,S.cash-BOT.reserve));if(bp.units>0)applyPlan(bp);}
function botBiz(t){if(!t.owner){if(S.cash-t.price>BOT.reserve*4&&foreignKiosks().length===0){S.cash-=t.price;S.diag.spent.biz+=t.price;t.owner='you';t.level=1;}return;}
  let g=0;while(g++<20&&t.level<t.cfg.upg){const c=bizUpCost(t);if(S.cash-c<BOT.reserve+botGoal())break;S.cash-=c;S.diag.spent.upg+=c;t.level++;}}
function botProd(t){if(!t.level){if(prodReady(t)&&S.cash-prodCost(t)>BOT.reserve){S.cash-=prodCost(t);S.diag.spent.prod+=prodCost(t);t.level=1;mark('prod');}}
  else if(t.level<CFG.PROD.levels&&S.cash-prodCost(t)>BOT.reserve*3){S.cash-=prodCost(t);S.diag.spent.prod+=prodCost(t);t.level++;}}
// своя точка при остановке: качаем самое дешёвое, что по карману, деньги под цель бережём; на максимуме — перестраиваем
async function botKiosk(t){let g=0;
  while(g++<30){const opts=[];if(t.capLvl<upgMax(t))opts.push({k:'cap',c:capCost(t)});if(t.salesLvl<upgMax(t))opts.push({k:'sal',c:salesCost(t)});
    const best=opts.filter(o=>S.cash-o.c>=BOT.reserve+botGoal()).sort((a,b)=>a.c-b.c)[0];if(!best)break;
    S.cash-=best.c;S.diag.spent.upg+=best.c;if(best.k==='cap')t.capLvl++;else t.salesLvl++;}
  if(canRebuild(t)&&S.cash-rebuildCost(t)>=BOT.reserve)await rebuildFlow(t);}
// сколько денег бот придерживает под ближайшую цель: отправка, потом перестройка, потом заказ
function botGoal(){if(S.ships<3)return shipSum();const o=orderNeed();return o?o.cash:0;}
function botShip(){const s=shipSum();if(s&&S.cash-s>=BOT.reserve)shipFlow();}
async function botOrder(){const o=orderNeed();if(o&&o.ok&&S.cash-o.cash>=BOT.reserve)await orderFlow();}
function botSeeds(){const stuck=myKiosks().some(t=>canRebuild(t)&&S.cash>=rebuildCost(t)); // перестройка доступна, но бот её не взял — упёрлись в крышу: качаем сильных
  const top=BOT.seedPolicy==='top'||(BOT.seedPolicy==='smart'&&stuck);let g=0;
  while(g++<50){const list=S.pat.slice().sort((a,b)=>top?b.power-a.power:seedCost(a.lvl)-seedCost(b.lvl));const p=list[0];if(!p||S.seeds<seedCost(p.lvl))break;if(!levelUp(p))break;}}
async function botTurn(){botSeeds();}   // всё остальное бот делает только при остановке на клетке — как игрок
async function batch(n,opt){

    res.push(runResult()); if(opt.onGame)opt.onGame(res[res.length-1],g);
  }

  const avg=f=>Math.round(res.reduce((a,r)=>a+f(r),0)/(res.length||1)*10)/10, sum=f=>res.reduce((a,r)=>a+f(r),0);

  const row={runId:'bot-'+Date.now().toString(36),kind:'bot',version:VERSION,cfg:cfgHash(),updatedAt:Date.now(),games:res.length,map,
    finished:fin,laps:avg(r=>r.laps),fights:avg(r=>r.fights),winrate:fights?Math.round(wins/fights*100):0,
    byKind:{capture:kind('capture'),rebuild:kind('rebuild'),kulak:kind('kulak'),fight:kind('fight'),raid:kind('raid')},
    picks:{weak:avg(r=>r.picks.weak),mid:avg(r=>r.picks.mid),strong:avg(r=>r.picks.strong)},skipped:avg(r=>r.skipped),noBodies:avg(r=>r.noBodies),

    skips:Object.fromEntries(['capture','rebuild','kulak','fight','raid'].map(k=>[k,avg(r=>r.skips[k]||0)])),
    incomeAt:[5,10,20,30,40,60,80,100,150,200].map((l,i)=>avg(r=>r.incomeAt[i])),
    marks:Object.fromEntries(['half','allCaptured','ship1','ship2','ship3','tier2','tier3','allTier3','prod','order1','order2','order3'].map(k=>[k,avg(r=>r.marks[k]===undefined?r.laps:r.marks[k])])),energetics:avg(r=>r.energetics),seedSpent:avg(r=>r.seedSpent),lvlBought:avg(r=>r.lvlBought),seedsLeft:avg(r=>r.seedsLeft),
    raids:avg(r=>r.raids),looted:avg(r=>r.looted),captures:avg(r=>r.captures),rebuilds:avg(r=>r.rebuilds),produced:avg(r=>r.produced),prods:avg(r=>r.prods),
    tiers:[0,1,2].map(i=>avg(r=>r.tiers[i])),shipped:avg(r=>r.shipped),cash:avg(r=>r.cash),
    income:{sales:avg(r=>r.income.sales),fees:avg(r=>r.income.fees),kulak:avg(r=>r.income.kulak),fight:avg(r=>r.income.fight)},
    spent:{upg:avg(r=>r.spent.upg),rebuild:avg(r=>r.spent.rebuild),ship:avg(r=>r.spent.ship),order:avg(r=>r.spent.order),prod:avg(r=>r.spent.prod),biz:avg(r=>r.spent.biz),goods:avg(r=>r.spent.goods)},
    wasted:avg(r=>r.wasted),
    orders:avg(r=>r.orders),ships:avg(r=>r.ships)};
  histPush(row);getDb().then(db=>{if(db)db.doc(`runs/${row.runId}`).set(row).catch(()=>{});});
  newGame({map});S.tips.intro=true;if(who)S.player=who;
  log('———');log(`Прогон ${n} партий (карта ${map}): доиграно ${fin}, кругов ${row.laps}, боёв ${row.fights} (${row.winrate}%), за круг ${row.fightsPerLap}`);
  log(`Наборы: слабые ${row.picks.weak} · средние ${row.picks.mid} · сильные ${row.picks.strong} · пропусков ${row.skipped} · некем ${row.noBodies} · коллекция в бою ${row.usage}%`);
  log(`Бои: захват ${row.byKind.capture} · перестройка ${row.byKind.rebuild} · Кулак ${row.byKind.kulak} · драка ${row.byKind.fight} · налёт ${row.byKind.raid}`);
  log(`Тиры ${row.tiers.join('/')} · цехов ${row.prods} · отправлено ${fmtR(row.shipped)} · семок потрачено ${row.seedSpent} (${row.lvlBought} ур.) · энергетиков ${row.energetics}`);

// фигурка: тень, куртка трапецией, голова; у своего — красная кепка с козырьком, у налётчика — чёрные очки
function drawFigure(x,y,o){
  const s=(o.scale||1)*TW, r=s*0.10, top=y-s*0.40, bot=y-s*0.01, w=s*0.14;

  const hy=top-r*0.95;
  cx.fillStyle=o.skin||'#e8c39e';cx.beginPath();cx.arc(x,hy,r,0,Math.PI*2);cx.fill();cx.stroke();
  if(o.cap){cx.fillStyle=o.cap;cx.beginPath();cx.arc(x,hy-r*0.05,r*1.02,Math.PI,0);cx.closePath();cx.fill();cx.stroke();   // кепка
    cx.beginPath();cx.moveTo(x-r*0.2,hy-r*0.1);cx.lineTo(x+r*1.55,hy-r*0.1);cx.lineTo(x+r*1.5,hy+r*0.18);cx.lineTo(x-r*0.2,hy+r*0.18);cx.closePath();cx.fill();cx.stroke();}   // козырёк
  if(o.shades){cx.fillStyle='#111';cx.beginPath();cx.roundRect(x-r*0.95,hy-r*0.35,r*1.9,r*0.55,r*0.2);cx.fill();      // очки
    cx.fillStyle='#e8c39e';cx.fillRect(x-r*0.08,hy-r*0.3,r*0.16,r*0.45);}
  cx.restore();
}
function draw(){
  const r=cv.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);
  let hx,hy,hop=0;
  if(anim&&anim.done&&S.pos===anim.to)anim=null;
  if(anim){const[a1,a2]=gridOf(anim.from),[b1,b2]=gridOf(anim.to),p=anim.p||0;const A=iso(a1,a2),B=iso(b1,b2);hx=A[0]+(B[0]-A[0])*p;hy=A[1]+(B[1]-A[1])*p;hop=Math.sin(Math.PI*p)*TH*0.7;}
  else{const[g1,g2]=gridOf(S.pos);[hx,hy]=iso(g1,g2);}
  if(camHold&&Date.now()<camHold.until)camT={x:camHold.x,y:camHold.y};else{camHold=null;camT={x:hx,y:hy-TH*0.9};}
  {const now2=performance.now();const dt=Math.min(0.05,((now2-(camLast||now2))||16)/1000);camLast=now2;const a=1-Math.exp(-CFG.CAM_SMOOTH*dt);cam.x+=(camT.x-cam.x)*a;cam.y+=(camT.y-cam.y)*a;}
  camMoving=Math.hypot(camT.x-cam.x,camT.y-cam.y)>0.5;
  const offX=r.width/2-cam.x+pan.x,offY=(r.height-panelH())/2-cam.y+pan.y;
  cx.save();cx.translate(offX,offY);
  const order=S.tiles.slice().sort((a,b)=>{const[ax,ay]=gridOf(a.i),[bx,by]=gridOf(b.i);return(ax+ay)-(bx+by);});
  cx.beginPath();const c=[iso(1,1),iso(9,1),iso(9,9),iso(1,9)];cx.moveTo(c[0][0],c[0][1]);c.forEach(p=>cx.lineTo(p[0],p[1]));cx.closePath();cx.fillStyle='#123020';cx.fill();
  const[cxx,cyy]=iso(5,5);cx.fillStyle='#1e5236';cx.font=`${Math.round(TW*0.2)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(`РАЙОН ${CFG.DISTRICT} · КРУГ ${S.laps}`,cxx,cyy);
  const pill=(px,py,text,fg,sz,bg)=>{cx.font=`bold ${Math.round(sz)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';const w=cx.measureText(text).width+sz*0.9,hh=sz*1.35;cx.fillStyle=bg||'#f1e9d2';cx.beginPath();cx.roundRect(px-w/2,py-hh/2,w,hh,hh/2);cx.fill();cx.fillStyle=fg;cx.fillText(text,px,py+0.5);return w;};
  const now=Date.now();let anyPulse=false;const figs=[];
  for(const t of order){
    const[gx,gy]=gridOf(t.i),[x,y]=iso(gx,gy),col=tileColor(t);
    cx.fillStyle=col;cx.beginPath();cx.moveTo(x,y-TH/2);cx.lineTo(x+TW/2,y);cx.lineTo(x,y+TH/2);cx.lineTo(x-TW/2,y);cx.closePath();cx.fill();
    cx.strokeStyle=isMine(t)?(t.captured?'#ffd0c6':'#bdf5c9'):'#00000033';cx.lineWidth=t.owner?2:1;cx.stroke();
    let ic=TILE_ICON[t.type]||'';if(t.type==='prod')ic=t.level?'🏭':'🚧';else if(t.type==='biz')ic=bizIcon(t);else if(t.type==='kiosk')ic=good(t.cat).icon;
    const iy=isMine(t)?y-TH*0.08:y-TH*0.02;
    cx.font=`${Math.round(TW*0.34)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(ic,x,iy);
    if(t.type==='kiosk'){
      if(!t.owner){pill(x,y-TH*0.62,'⚔️'+guardShown(t),'#fff',TW*0.13,gradeCol[t.grade]);}
      else{
        if(t.captured){anyPulse=true;cx.globalAlpha=0.4+0.6*(0.5+0.5*Math.sin(now/200));cx.strokeStyle='#ff6a55';cx.lineWidth=2;cx.beginPath();cx.moveTo(x,y-TH/2);cx.lineTo(x+TW/2,y);cx.lineTo(x,y+TH/2);cx.lineTo(x-TW/2,y);cx.closePath();cx.stroke();cx.globalAlpha=1;
          pill(x-TW*0.16,y-TH*0.62,'⚔️'+t.captured.power,'#fff',TW*0.13,gradeCol[t.captured.grade]);figs.push({x:x+TW*0.22,y:y+TH*0.12,o:{body:'#2b2723',stripe:'#8d3320',shades:true,scale:0.85}});}
        else{const pc=Math.max(0,Math.min(1,t.goods/cap(t))),R=TW*0.20;cx.lineWidth=TW*0.035;cx.strokeStyle='#0006';cx.beginPath();cx.arc(x,iy,R,0,Math.PI*2);cx.stroke();
          if(pc>0){cx.strokeStyle=pc>=0.3?'#3f8f4a':'#f2b632';cx.beginPath();cx.arc(x,iy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*pc);cx.stroke();}else{cx.strokeStyle='#d64541';cx.beginPath();cx.arc(x,iy,R,0,Math.PI*2);cx.stroke();}
          // уровень точки — цифрой, вместе с тиром: «II · ур.4»; точки-пипсы не читались
          pill(x,y+TH*0.3,(t.tier>1?['','II','III'][t.tier-1]+' · ':'')+'ур.'+klevel(t),t.tier>1?'#f2b632':'#f1e9d2',TW*0.12,'#2b2723');}}
    }
    if(t.type==='biz'&&isMine(t))pill(x,y-TH*0.62,'₽'+shortN(bizPass(t))+' · 💰'+shortN(bizLand(t)),'#3f8f4a',TW*0.12);
    if(t.type==='prod'&&t.level)pill(x,y-TH*0.62,'+'+prodOut(t)+' '+good(t.cat).icon,'#fff',TW*0.13,'#5a4a8a');
  }
  for(const f of figs)drawFigure(f.x,f.y,f.o);
  {const ht=S.tiles[anim?((anim.p||0)<0.5?anim.from:anim.to):S.pos];const dx=ht&&ht.captured?-TW*0.2:0;
   drawFigure(hx+dx,hy+TH*0.1-hop,{body:'#3e5a8a',stripe:'#f1e9d2',cap:'#c9432f',scale:1.05});}
  floats=floats.filter(f=>f.t<1);
  for(const f of floats){cx.globalAlpha=1-f.t;cx.fillStyle=f.color;cx.font=`bold ${Math.round(TW*0.24*(f.size||1))}px sans-serif`;cx.textAlign='center';cx.fillText(f.text,f.x,f.y-f.t*40*(f.size||1));cx.globalAlpha=1;f.t+=(f.size>1?0.012:0.02)*CFG.SPEED;}
  cx.restore();
  if(camMoving||anyPulse)kick();
}
function render(){
  if(!S)return;
  $('sCash').textContent=shortN(S.cash);$('sHard').textContent=S.hard;$('sSeeds').textContent=shortN(S.seeds||0);$('sFree').textContent=freeBodies().length+'/'+S.pat.length;
  $('tLap').textContent='круг '+S.laps;
  {const o=orderNeed(),ob=$('orderBar');
   if(S.ships<3){const s=shipSum(),p=Math.min(100,Math.round(S.cash/s*100));ob.querySelector('i').style.width=p+'%';ob.querySelector('.me').textContent=`📤 отправка ${S.ships+1}/3`;ob.querySelector('.them').textContent=`${shortN(Math.max(0,S.cash))} / ${shortN(s)}`;ob.querySelector('b').textContent='';}
   else if(o){const g=CATS.reduce((a,c)=>a+Math.min(1,(S.made[c]||0)/o.goods),0)/o.cats,c=Math.min(1,Math.max(0,S.cash)/o.cash),p=Math.round(Math.min(1,g,c)*100);ob.querySelector('i').style.width=p+'%';ob.querySelector('.me').textContent=`📦 заказ ${S.orders+1}/${CFG.ORDERS.length}`;ob.querySelector('.them').textContent=`${o.ready}/${o.cats} кат. · ${shortN(S.cash)}/${shortN(o.cash)}`;ob.querySelector('b').textContent='';}
   else{ob.querySelector('i').style.width='100%';ob.querySelector('.me').textContent='район закрыт';ob.querySelector('.them').textContent='';}}
  const tired=tiredBodies().length;$('tSquad').textContent=tired?`Пацаны · 💤${tired}`:'Пацаны';$('bSquad').className='dk'+(tired&&canEnergetic()?' warn':'');
  $('bRoll').disabled=moving||S.finished;$('bRoll').className='dice'+(S.jail>0?' jail':'');$('bRoll').querySelector('.die').textContent=S.rolls>0?'🎲':'⏳';renderRolls();
  $('bSquad').disabled=moving;$('bRunD').disabled=moving;
  const ct=S.tiles[S.pos],tb=$('tilebar');let tbText=null,can=false,btn='Открыть';
  if(!moving&&!S.finished){
    if(ct.type==='kiosk'){if(!ct.owner){tbText=`${pointName(ct)} · ${gradeName[ct.grade]} охрана ⚔️${guardShown(ct)}`;can=freeBodies().length>0;btn='Отбить';}
      else{tbText=`${pointName(ct)} · ${good(ct.cat).icon} ${ct.goods}/${cap(ct)}${ct.captured?' · 🕶 налёт':''}`;can=ct.captured?freeBodies().length>0:(ct.capLvl<upgMax(ct)&&S.cash>=capCost(ct))||(ct.salesLvl<upgMax(ct)&&S.cash>=salesCost(ct))||(canRebuild(ct)&&S.cash>=rebuildCost(ct));if(ct.captured)btn='Отбить';}}
    else if(ct.type==='biz'){tbText=`${bizIcon(ct)} ${bizName(ct)} · ${ct.owner?'ур. '+ct.level+' · касса '+fmtR(bizLand(ct)):fmtR(ct.price)}`;can=ct.owner?(ct.level<ct.cfg.upg&&S.cash>=bizUpCost(ct)):S.cash>=ct.price;}
    else if(ct.type==='wh'){tbText='🏬 Склад · закупка';can=myKiosks().length>0;}
    else if(ct.type==='prod'){tbText=`${ct.level?'🏭':'🚧'} ${prodName(ct.cat)} · ${catName(ct.cat)}${ct.level?' · +'+prodOut(ct)+'/круг':''}`;can=ct.level?S.cash>=prodCost(ct)&&ct.level<CFG.PROD.levels:prodReady(ct)&&S.cash>=prodCost(ct);}
    else if(ct.type==='home'){tbText='🏁 Хата · отправки и заказы';can=(shipSum()&&S.cash>=shipSum())||(()=>{const o=orderNeed();return o&&o.ok&&S.cash>=o.cash;})();}
  }
  tb.hidden=!tbText;if(tbText){$('tbText').textContent=tbText;tb.classList.toggle('can',!!can);tb.classList.toggle('cant',!can);tb.querySelector('b').textContent=btn;}
  draw();
}
// ---------- ввод ----------
let pd=null,pinch=null;
cv.addEventListener('wheel',e=>{e.preventDefault();CFG.ZOOM=Math.max(CFG.ZOOM_MIN,Math.min(CFG.ZOOM_MAX,CFG.ZOOM*(e.deltaY>0?1.1:0.9)));fit();draw();},{passive:false});
cv.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);CFG.ZOOM=Math.max(CFG.ZOOM_MIN,Math.min(CFG.ZOOM_MAX,CFG.ZOOM*pinch/d));pinch=d;fit();draw();e.preventDefault();}},{passive:false});
cv.addEventListener('touchend',()=>{pinch=null;});
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};dragging=false;});
cv.addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(Math.hypot(dx,dy)>6)dragging=true;if(dragging){pan={x:pd.px+dx,y:pd.py+dy};draw();}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{pd=null;}));
cv.addEventListener('click',e=>{
  if(dragging){dragging=false;return;}
  const r=cv.getBoundingClientRect(),sx=e.clientX-r.left-(r.width/2-cam.x+pan.x),sy=e.clientY-r.top-((r.height-panelH())/2-cam.y+pan.y);
  const gx=Math.round((sx/(TW/2)+sy/(TH/2))/2-0.5),gy=Math.round((sy/(TH/2)-sx/(TW/2))/2-0.5);
  const t=S.tiles.find(t=>{const[a,b]=gridOf(t.i);return a===gx&&b===gy;});if(!t||moving||S.finished)return;
  if(t.type==='kiosk')return t.owner?kioskWindow(t):foreignWindow(t);
  if(t.type==='biz')return bizWindow(t);
  if(t.type==='prod')return prodWindow(t);
  if(t.type==='home')return homeWindow();
  if(t.type==='wh')return toast('🏬 Склад: закупка товара для точек — когда остановишься на клетке.');
  if(t.type==='kulak')return toast('👊 Кулак: наезд на чужую базу, банда разной силы. Лут — товар на склад и рубли.');
  if(t.type==='fight')return toast('🥊 Драка: шпана района, за победу рубли и семки.');
  if(t.type==='granny')return toast('👵 Бабка: семки по кубикам, за рекламу вдвое.');
  if(t.type==='jail')return toast('🚔 Тюрьма: штраф или три попытки на дубль.');
  if(t.type==='lot')return toast('🌿 Пустырь. Пустая клетка: ничего не даёт и ничего не просит.');
});
$('tip').onclick=hideTip;$('modal').addEventListener('click',e=>{if(e.target===$('modal')&&!modalSticky)closeModal();});
$('toast').onclick=()=>{clearTimeout(toastT);$('toast').style.opacity=0;$('toast').style.pointerEvents='none';};
$('bRoll').onclick=roll;$('bSettings').onclick=settings;$('bSquad').onclick=()=>{if(!moving)squadWindow();};
$('bRunD').onclick=()=>{if(!moving)runWindow();};$('bRun').onclick=()=>{if(!moving)runWindow();};$('orderBar').onclick=()=>{if(!moving)homeWindow();};
$('tilebar').onclick=()=>{if(moving)return;const t=S.tiles[S.pos];if(t.type==='kiosk')return t.owner?kioskWindow(t):foreignWindow(t);if(t.type==='biz')return bizWindow(t);if(t.type==='wh')return storeWindow();if(t.type==='prod')return prodWindow(t);if(t.type==='home')return homeWindow();};
// сторож: ход завис без окна и анимации — отпускаем
let stuckAt=0;
setInterval(()=>{if(!S)return;const modalOpen=!$('modal').hidden;if(moving&&!modalOpen&&!(anim&&!anim.done)&&!S.fast){if(!stuckAt)stuckAt=Date.now();else if(Date.now()-stuckAt>2500){stuckAt=0;moving=false;save();render();draw();toast('Ход подвис — можно бросать дальше');track('stuck_recovered',{lap:S.laps,pos:S.pos});}}else stuckAt=0;},1000);
window.addEventListener('resize',()=>{fit();draw();if(!$('tip').hidden)positionTip();if(!$('modal').hidden)fitCard();});
if(window.ResizeObserver)new ResizeObserver(()=>{fit();draw();}).observe(cv);
if(!load())newGame();else if(S.finished)newGame({map:S.preset==null?20:S.preset});else if(!S.player)setTimeout(()=>askName(),50);
S.sessions=(S.sessions||0)+1;track('session_start',{sessions:S.sessions,v:VERSION,cfg:cfgHash()});
fit();{const[g1,g2]=gridOf(S.pos);const[x,y]=iso(g1,g2);cam={x,y:y-TH*0.4};}render();
